<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reset your password — MicroChef</title>
<link rel="stylesheet" href="_style.css" />
<style>
  form { margin-top: 24px; }
  label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  input {
    width: 100%; padding: 14px 16px; font-size: 16px; border-radius: 14px;
    border: 1px solid var(--hairline); background: #fff; color: var(--char);
    margin-bottom: 16px; -webkit-appearance: none;
  }
  button {
    width: 100%; padding: 16px; font-size: 16px; font-weight: 700; color: #fff;
    background: var(--ember); border: 0; border-radius: 14px; cursor: pointer;
  }
  button[disabled] { opacity: .5; cursor: default; }
  .msg { margin-top: 16px; padding: 14px 16px; border-radius: 14px; font-size: 15px; }
  .msg.err { background: #FDE7E2; color: #8C2A12; }
  .msg.ok  { background: #E3F1E8; color: #2F6B47; }
  .hidden { display: none; }
  @media (prefers-color-scheme: dark) {
    input { background: #241C19; color: #FDF8F3; }
    .msg.err { background: #4A1F14; color: #FFC9BA; }
    .msg.ok  { background: #1E3A29; color: #BFE6CE; }
  }
</style>
</head>
<body>
<main>
  <header>
    <p class="eyebrow">MicroChef</p>
    <h1>Reset your password</h1>
    <p class="meta" id="sub">Checking your link…</p>
  </header>

  <form id="form" class="hidden" autocomplete="on">
    <label for="pw">New password</label>
    <input id="pw" type="password" autocomplete="new-password" minlength="6" required
           placeholder="At least 6 characters" />
    <label for="pw2">Confirm new password</label>
    <input id="pw2" type="password" autocomplete="new-password" minlength="6" required />
    <button id="submit" type="submit">Set new password</button>
  </form>

  <div id="msg" class="msg hidden" role="alert"></div>

  <footer>
    <p>Once it's changed, return to the MicroChef app and sign in with your new password.</p>
    <p><a href="index.html">Legal &amp; support</a></p>
  </footer>
</main>

<script type="module">
// Supabase emails a recovery link pointing here with the tokens in the URL
// fragment (implicit flow — the app's client sets no flowType, so PKCE, which
// would need a verifier this page could never have, is not in play).
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// Both values are public by design: the anon key ships inside the app bundle.
const supabase = createClient(
  'https://hjydrmkldtpxeufviofn.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhqeWRybWtsZHRweGV1ZnZpb2ZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxNDU2OTQsImV4cCI6MjA5NzcyMTY5NH0.cvFdBLmjK60rgwXDv87BI2YMuxbeha09qy38rRnCQmw',
  { auth: { detectSessionInUrl: true, persistSession: false, autoRefreshToken: false } }
);

const sub = document.getElementById('sub');
const form = document.getElementById('form');
const msg = document.getElementById('msg');
const submit = document.getElementById('submit');

function show(text, kind) {
  msg.textContent = text;
  msg.className = 'msg ' + kind;
}

function fail(text) {
  sub.textContent = 'This link can’t be used.';
  form.classList.add('hidden');
  show(text, 'err');
}

// An expired or already-used link comes back as an error in the fragment
// rather than a session, so say so plainly instead of showing a form that
// cannot work.
const hash = new URLSearchParams(location.hash.slice(1));
if (hash.get('error') || hash.get('error_description')) {
  fail((hash.get('error_description') || 'This reset link has expired.').replace(/\+/g, ' ') +
       ' Request a new one from the app.');
} else {
  const { data } = await supabase.auth.getSession();
  if (data.session) {
    sub.textContent = 'Choose a new password for your account.';
    form.classList.remove('hidden');
  } else {
    fail('This reset link has expired or has already been used. Request a new one from the app.');
  }
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  const pw = document.getElementById('pw').value;
  const pw2 = document.getElementById('pw2').value;

  if (pw.length < 6) return show('Password must be at least 6 characters.', 'err');
  if (pw !== pw2) return show('Those passwords don’t match.', 'err');

  submit.disabled = true;
  show('Saving…', 'ok');
  const { error } = await supabase.auth.updateUser({ password: pw });
  if (error) {
    submit.disabled = false;
    return show(error.message || 'Could not update your password. Please try again.', 'err');
  }
  form.classList.add('hidden');
  sub.textContent = 'All set.';
  show('Your password has been changed. Open MicroChef and sign in with it.', 'ok');
});
</script>
</main>
</body>
</html>
